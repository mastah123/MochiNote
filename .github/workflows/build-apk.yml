name: Build Android APK

# Runs whenever you push to the android-apk branch (or press "Run workflow" if it is shown).
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the web app into www
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp -r css js assets www/

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use the MochiNote icon
        run: |
          if command -v convert >/dev/null 2>&1 && [ -f assets/icon-512.png ]; then
            RES=android/app/src/main/res
            rm -rf $RES/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir=${d%%:*}; size=${d##*:}
              convert assets/icon-512.png -resize ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
              cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
              cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_foreground.png
            done
          else
            echo "No ImageMagick or no icon: keeping the default icon"
          fi

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: MochiNote-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
