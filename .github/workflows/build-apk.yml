name: Build Android APK

# Starts when you commit to the android-apk branch. The web app lives in the app/ folder of this branch,
# so this branch is self-contained. To update the app, replace the files in app/ and commit.
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get this branch (Android build files + the app in app/)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the web app into www
        run: |
          mkdir -p www
          cp app/index.html app/manifest.webmanifest www/
          cp -r app/css app/js app/assets www/

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use the MochiNote icon
        continue-on-error: true
        run: |
          command -v convert >/dev/null 2>&1 || command -v magick >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y imagemagick; }
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          ICON=icon/foreground.png   # the cat on a transparent background
          BG='#FFF6EC'
          # adaptive icon (Android 8+): paper-coloured background + the logo in the safe zone
          sed -i "s/#FFFFFF/$BG/I" $RES/values/ic_launcher_background.xml
          for d in mdpi:108:48 hdpi:162:72 xhdpi:216:96 xxhdpi:324:144 xxxhdpi:432:192; do
            IFS=: read dir fg legacy <<< "$d"
            inner=$((fg * 64 / 100))
            $IM $ICON -resize ${inner}x${inner} -background none -gravity center -extent ${fg}x${fg} $RES/mipmap-$dir/ic_launcher_foreground.png
            lg=$((legacy * 78 / 100))
            $IM -size ${legacy}x${legacy} xc:"$BG" \( $ICON -resize ${lg}x${lg} \) -gravity center -composite $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: MochiNote-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
