name: Build Android APK

# Starts when you commit to the android-apk branch. To rebuild with the newest app files from master:
# open the latest run on the Actions tab and press "Re-run all jobs".
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the Android build files (this branch)
        uses: actions/checkout@v4

      - name: Get the newest app files from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: web

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the web app into www
        run: |
          mkdir -p www
          cp web/index.html web/manifest.webmanifest www/
          cp -r web/css web/js web/assets www/

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use the MochiNote icon
        run: |
          command -v convert >/dev/null 2>&1 || sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          ICON=web/assets/icon-512.png
          BG='#FFFCF5'
          # adaptive icon (Android 8+): paper-coloured background + the logo in the safe zone
          sed -i "s/#FFFFFF/$BG/I" $RES/values/ic_launcher_background.xml
          for d in mdpi:108:48 hdpi:162:72 xhdpi:216:96 xxhdpi:324:144 xxxhdpi:432:192; do
            IFS=: read dir fg legacy <<< "$d"
            inner=$((fg * 64 / 100))
            $IM $ICON -resize ${inner}x${inner} -background none -gravity center -extent ${fg}x${fg} $RES/mipmap-$dir/ic_launcher_foreground.png
            lg=$((legacy * 85 / 100))
            $IM -size ${legacy}x${legacy} xc:"$BG" \( $ICON -resize ${lg}x${lg} \) -gravity center -composite $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: MochiNote-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
