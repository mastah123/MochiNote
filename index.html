<!doctype html>
<html lang="en" data-theme="cream" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f1e7">
<title>MochiNote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23c68a2e%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27%3E%E2%9C%8E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- Sidebar / navigation -->
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand">
      <span class="logo" aria-hidden="true">✎</span>
      <span class="brand-name">MochiNote</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="all"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>All notes<span class="count" data-count="all"></span></button>
      <button class="nav-item" data-view="pinned"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 14v6"/></svg></span>Pinned<span class="count" data-count="pinned"></span></button>
      <button class="nav-item" data-view="archive"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="4.5" rx="1.2"/><path d="M5 8.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5M10 12.5h4"/></svg></span>Archive<span class="count" data-count="archive"></span></button>
      <button class="nav-item" data-view="trash"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></span>Trash<span class="count" data-count="trash"></span></button>
      <button class="nav-item" data-view="settings"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span>Settings</button>
    </nav>
    <div class="side-section">
      <div class="side-head"><span>Folders</span><button class="btn-text" id="addFolderBtn">+ New folder</button></div>
      <div id="sideFolders" class="side-list"></div>
    </div>
    <div class="side-section">
      <div class="side-head"><span>Tags</span></div>
      <div id="sideTags" class="side-list tags-list"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Main -->
  <main class="main" id="main" data-view="all">
    <div class="head-fixed" id="headFixed">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" aria-label="Open menu" title="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 15h10"/></svg></button>
        <h1 class="view-title" id="viewTitle">All notes</h1>
        <span class="save-pill" id="globalStatus" role="status" aria-live="polite"></span>
      </header>

      <div class="home-head" id="homeHead">
        <div class="search-wrap">
          <span class="search-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
          <input type="search" id="search" placeholder="Search notes, words, #tags..." aria-label="Search notes" autocomplete="off">
        </div>
        <button class="icon-btn only-mobile" id="searchBtn" aria-label="Search" aria-expanded="false" title="Search">
          <svg class="sb-open" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <svg class="sb-close" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>

    <section id="notesView">
      <div class="hero" id="hero" hidden>
        <button class="hero-edit" id="heroEdit" aria-label="Edit this card" title="Edit"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
        <div class="hero-kicker">Your space</div>
        <div class="hero-title" id="heroTitle">A little bit of everything ☁️</div>
        <div class="hero-sub" id="heroSub">Ideas, reminders &amp; random thoughts.</div>
      </div>

      <div class="controls">
        <span class="notes-label" id="notesLabel"></span>
        <label class="sel"><span class="sel-txt">Sort</span>
          <svg class="sel-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
          <select id="sortSelect" aria-label="Sort notes">
            <option value="edited">Recently edited</option>
            <option value="created-desc">Created: newest</option>
            <option value="created-asc">Created: oldest</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
          </select>
        </label>
        <div class="seg" role="group" aria-label="Notes view">
          <button id="viewGrid" class="seg-btn" aria-pressed="true" aria-label="Notes as grid" title="Grid view"><span class="seg-txt">Grid</span><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
          <button id="viewList" class="seg-btn" aria-pressed="false" aria-label="Notes as list" title="List view"><span class="seg-txt">List</span><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button>
        </div>
      </div>

      <div class="filters" id="filters"></div>

      <div class="folder-section" id="folderSection">
        <div class="folder-head">
          <span class="fh-title">Folders</span>
          <button class="show-all" id="showAllFolders">Show all</button>
          <div class="seg seg-flat" role="group" aria-label="Folders view">
            <button id="fvGrid" class="seg-btn" aria-pressed="true" aria-label="Folders as grid" title="Folders as grid"><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
            <button id="fvList" class="seg-btn" aria-pressed="false" aria-label="Folders as list" title="Folders as list"><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button>
          </div>
        </div>
        <div id="folderStrip" class="folder-strip"></div>
      </div>

      <div id="trashBar" class="trash-bar" hidden>
        <span>Notes in Trash can be restored or deleted forever.</span>
        <button class="btn-danger" id="emptyTrash">Empty Trash</button>
      </div>
      <div id="notes" class="notes grid" aria-live="polite"></div>
      <div id="empty" class="empty" hidden></div>
    </section>

    <section id="foldersView" hidden>
      <div class="page-head">
        <button class="icon-btn" id="foldersBack" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <h2>Folders</h2>
        <button class="btn-text" id="foldersNew">+ New folder</button>
      </div>
      <div id="allFolders" class="folder-strip grid"></div>
    </section>

    <section id="settingsView" hidden></section>
  </main>

  <button class="fab" id="newNote"><span aria-hidden="true">+</span> New note</button>

  <!-- Editor sheet -->
  <div class="editor-layer" id="editorLayer" hidden>
    <div class="editor-backdrop" id="editorBackdrop"></div>
    <article class="editor" id="editor" role="dialog" aria-modal="true" aria-label="Note editor">
      <header class="ed-top">
        <button class="icon-btn" id="edBack" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <!-- Desktop: text save pill centered -->
        <span class="save-pill desktop-only" id="edStatusDesktop" role="status" aria-live="polite"></span>
        <!-- Desktop: format + pin buttons -->
        <button class="btn-text desktop-only" id="edFmtDesktop" aria-pressed="false" aria-label="Formatting" title="Formatting">Format</button>
        <button class="btn-text desktop-only" id="edPin" aria-label="Pin note">Pin</button>
        <!-- Mobile: Aa format button + flexible space -->
        <span class="ed-top-spacer mobile-only"></span>
        <button class="icon-btn txt mobile-only" id="edFmt" aria-pressed="false" aria-label="Formatting" title="Formatting">Aa</button>
        <div class="ed-actions">
          <button class="icon-btn" id="edMenuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg></button>
          <div class="menu" id="edMenu" hidden>
            <div class="menu-theme" id="edMenuTheme" role="group" aria-label="Note theme"><span>Theme</span><div id="edMenuColors" class="swatches"></div></div>
            <button data-act="pin" id="edPinItem"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 14v6"/></svg><span id="edPinLabel">Pin</span></button>
            <button data-act="move"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span>Move to folder…</span></button>
            <button data-act="archive"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="4.5" rx="1.2"/><path d="M5 8.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5M10 12.5h4"/></svg><span>Archive</span></button>
            <button data-act="delete" class="danger"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>Move to Trash</span></button>
          </div>
        </div>
      </header>
      <!-- Desktop meta row: folder selector + color swatches -->
      <div class="ed-meta desktop-only" id="edMeta">
        <select id="edFolder" aria-label="Folder"></select>
        <div id="edColors" class="swatches"></div>
      </div>
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
        <div class="tb-head mobile-only"><span class="tb-title">Format</span><button type="button" class="icon-btn" id="tbClose" aria-label="Close formatting bar">✕</button></div>
        <button data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo (Ctrl+Z)"><span class="t-txt">Undo</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo (Ctrl+Y)"><span class="t-txt">Redo</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <span class="sep"></span>
        <button data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
        <button data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
        <span class="sep"></span>
        <select id="blockSel" aria-label="Paragraph style">
          <option value="p">Paragraph</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
        </select>
        <button data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list"><span class="t-txt">• List</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="6" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="5" cy="18" r="1.2"/><path d="M10 6h10M10 12h10M10 18h10"/></svg></button>
        <button data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list"><span class="t-txt">1. List</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 4.5 5.5 4v4M4 11h3l-3 3h3M4 17h3l-1.5 1.5L7 20H4" stroke-width="1.4"/></svg></button>
        <button data-cmd="checklist" title="Checklist" aria-label="Checklist"><span class="t-txt">☑ Checklist</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="5" height="5" rx="1.2"/><path d="m4.5 6.5 1 1 2-2" stroke-width="1.4"/><rect x="3.5" y="14" width="5" height="5" rx="1.2"/><path d="M12 6.5h8.5M12 16.5h8.5"/></svg></button>
        <button data-cmd="callout" class="mobile-only" title="Callout card" aria-label="Callout card"><span class="t-emoji">💡</span></button>
        <span class="sep"></span>
        <button data-cmd="justifyLeft" title="Align left" aria-label="Align left"><span class="t-txt">Left</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
        <button data-cmd="justifyCenter" title="Align center" aria-label="Align center"><span class="t-txt">Center</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
        <button data-cmd="justifyRight" title="Align right" aria-label="Align right"><span class="t-txt">Right</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
        <span class="sep"></span>
        <select id="fontSel" aria-label="Font">
          <option value="">Font</option>
          <option value="Georgia, serif">Serif</option>
          <option value="system-ui, sans-serif">Sans</option>
          <option value="'Courier New', monospace">Mono</option>
          <option value="'Comic Sans MS', 'Trebuchet MS', cursive">Playful</option>
        </select>
        <select id="sizeSel" aria-label="Font size">
          <option value="">Size</option>
          <option value="2">Small</option>
          <option value="3">Normal</option>
          <option value="4">Large</option>
          <option value="5">XL</option>
          <option value="6">XXL</option>
        </select>
        <label class="hl" title="Highlight text">Highlight
          <select id="hlSel" aria-label="Highlight color">
            <option value="">Choose…</option>
            <option value="#fde68a">Yellow</option>
            <option value="#bbf7d0">Green</option>
            <option value="#fbcfe8">Pink</option>
            <option value="#bfdbfe">Blue</option>
            <option value="none">Remove</option>
          </select>
        </label>
        <span class="sep"></span>
        <span class="sep"></span>
        <button data-cmd="link" title="Insert link" aria-label="Insert link"><span class="t-txt">Link</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
        <button data-cmd="image" title="Attach image" aria-label="Attach image"><span class="t-txt">Image</span><svg class="t-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-9 9"/></svg></button>
        <input type="file" id="imgInput" accept="image/*" hidden>
      </div>

      <div class="ed-scroll" id="edScroll">
        <input id="edTitle" class="ed-title" placeholder="Title" aria-label="Note title" maxlength="200">
        <div id="edBody" class="ed-body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note content" spellcheck="true" data-placeholder="Start writing… use #tags anywhere"></div>
      </div>
      <div class="tag-suggest" id="tagSuggest" hidden></div>
      <footer class="ed-foot">
        <span class="save-icon-mobile mobile-only" id="edStatus" role="status" aria-live="polite"></span>
        <div id="edTags" class="tags"></div>
        <span id="edInfo" class="info"></span>
      </footer>
    </article>
  </div>

  <!-- Action sheet (long-press menus on mobile) -->
  <div class="sheet-layer" id="sheetLayer" hidden>
    <div class="sheet-scrim" id="sheetScrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-title" id="sheetTitle"></div>
      <div class="sheet-items" id="sheetItems"></div>
    </div>
  </div>

  <!-- Generic dialog -->
  <dialog id="dlg" class="dlg">
    <form method="dialog" id="dlgForm">
      <h2 id="dlgTitle"></h2>
      <p id="dlgMsg"></p>
      <input id="dlgInput" hidden>
      <input id="dlgInput2" hidden>
      <select id="dlgSelect" hidden></select>
      <div class="dlg-btns">
        <button value="cancel" class="btn-ghost" id="dlgCancel">Cancel</button>
        <button value="ok" class="btn-primary" id="dlgOk">OK</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="js/logic.js"></script>
<script src="js/db.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
