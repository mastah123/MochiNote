<!doctype html>
<html lang="en" data-theme="mochi" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fbf9f6">
<title>MochiNote</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="alternate icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/theme-and-buttons.css">
<link rel="stylesheet" href="css/home-and-notes.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/dialog-and-settings.css">
<link rel="stylesheet" href="css/desktop-layout.css">
<link rel="stylesheet" href="css/cards-and-stickers.css">
<link rel="stylesheet" href="css/mobile-home-and-sheets.css">
<link rel="stylesheet" href="css/editor-extras.css">
<link rel="stylesheet" href="css/desktop-home.css">
<link rel="stylesheet" href="css/mochi-design.css">
</head>
<body>
<div class="app" id="app">

  <!-- Sidebar / navigation -->
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand">
      <img class="logo" src="assets/logo.svg" alt="" width="40" height="40">
      <span class="brand-name">MochiNote</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="all"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.4 12 4l8 7.4V19a1.5 1.5 0 0 1-1.5 1.5h-3.3v-5.3H8.8v5.3H5.5A1.5 1.5 0 0 1 4 19z"/></svg></span>Home</button>
      <button class="nav-item" data-view="notes"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>All notes<span class="count" data-count="notes"></span></button>
      <button class="nav-item" data-act="search"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>Search</button>
      <button class="nav-item" data-act="templates"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></span>Templates</button>
      <button class="nav-item" data-view="due"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span>Reminders<span class="count" data-count="due"></span></button>
      <button class="nav-item" data-view="pinned"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 14v6"/></svg></span>Pinned<span class="count" data-count="pinned"></span></button>
      <button class="nav-item" data-view="archive"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="4.5" rx="1.2"/><path d="M5 8.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5M10 12.5h4"/></svg></span>Archive<span class="count" data-count="archive"></span></button>
      <button class="nav-item" data-view="trash"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></span>Trash<span class="count" data-count="trash"></span></button>
      
    </nav>
    <div class="side-scroll">
    <div class="side-section">
      <div class="side-head"><span>Categories</span><button class="btn-text" id="addFolderBtn">+ New folder</button></div>
      <div id="sideFolders" class="side-list"></div>
      <div class="side-more" id="sideFoldersMore" hidden><button class="btn-text" id="sideShowAllFolders">Show all</button></div>
    </div>
    <div class="side-section">
      <div class="side-head"><span>Tags</span><button class="btn-text" id="sideShowAllTags" hidden>Show all</button></div>
      <div id="sideTags" class="side-list tags-list"></div>
    </div>
    </div>
    <div class="side-foot"><button class="nav-item" data-view="settings"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>Settings</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Main -->
  <main class="main" id="main" data-view="all">
    <div class="head-fixed" id="headFixed">
      <div class="home-brand" id="homeBrand"><img class="logo" src="assets/logo.svg" alt="" width="44" height="44"><span class="home-brand-name">MochiNote</span></div>
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" aria-label="Open menu" title="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 15h10"/></svg></button>
        <h1 class="view-title" id="viewTitle">All notes</h1>
        <span class="save-pill" id="globalStatus" role="status" aria-live="polite"></span>
      </header>

      <div class="home-head" id="homeHead">
        <div class="search-wrap">
          <span class="search-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
          <input type="search" id="search" placeholder="Search your notes..." aria-label="Search notes" autocomplete="off"><kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
        </div>
        <button class="icon-btn only-mobile" id="searchBtn" aria-label="Search" aria-expanded="false" title="Search">
          <svg class="sb-open" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <svg class="sb-close" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="top-tools">
          <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch light or dark mode" title="Light / dark"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button>
          <button class="avatar-btn" id="avatarBtn" type="button" aria-label="Your profile" title="Your profile"><img src="assets/mascot.svg" alt="" width="40" height="40"></button>
        </div>
      </div>
      <button class="icon-btn" id="profileBtn" type="button" aria-label="Your profile" title="Your profile"><svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg></button>
    </div>

    <section id="notesView">
      <div class="nv-main" id="nvMain">
      <div class="hero" id="hero" hidden>
        <h2 class="hero-title" id="heroTitle">Good morning, James!</h2>
        <button class="new-pill" id="heroNew" type="button"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New Note</span></button>
        <p class="hero-sub" id="heroSub">Small notes. Big ideas. Keep going!</p>
      </div>

      <button class="today-bar" id="todayBar" type="button" hidden></button>

      <div class="controls">
        <span class="notes-label" id="notesLabel"></span>
        <button class="view-all" id="viewAll" type="button" hidden>View all <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <label class="sel"><span class="sel-txt">Sort</span>
          <svg class="sel-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
          <select id="sortSelect" aria-label="Sort notes">
            <option value="edited">Recently edited</option>
            <option value="created-desc">Created: newest</option>
            <option value="created-asc">Created: oldest</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
          </select>
        </label>
        <div class="seg" role="group" aria-label="Notes view">
          <button id="viewGrid" class="seg-btn" aria-pressed="true" aria-label="Notes as grid" title="Grid view"><span class="seg-txt">Grid</span><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
          <button id="viewList" class="seg-btn" aria-pressed="false" aria-label="Notes as list" title="List view"><span class="seg-txt">List</span><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button>
        </div>
      </div>

      <div class="filters" id="filters"></div>
      <div class="tag-row" id="tagRow" hidden aria-label="Tags and filters"></div>

      <div class="folder-section" id="folderSection">
        <div class="folder-head">
          <span class="fh-title">Folders</span>
          <button class="show-all" id="showAllFolders">Show all</button>
          <div class="seg seg-flat" role="group" aria-label="Folders view">
            <button id="fvGrid" class="seg-btn" aria-pressed="true" aria-label="Folders as grid" title="Folders as grid"><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
            <button id="fvList" class="seg-btn" aria-pressed="false" aria-label="Folders as list" title="Folders as list"><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button>
          </div>
        </div>
        <div id="folderStrip" class="folder-strip"></div>
      </div>

      <div id="trashBar" class="trash-bar" hidden>
        <span>Notes in Trash can be restored or deleted forever.</span>
        <button class="btn-danger" id="emptyTrash">Empty Trash</button>
      </div>
      <div id="notes" class="notes grid" aria-live="polite"></div>
      <div id="empty" class="empty" hidden></div>
      <div class="home-footer" id="homeFooter" hidden>
        <img class="hf-mascot" src="assets/mascot.svg" alt="" width="56" height="56">
        <p class="hf-text">A little progress each day<br>leads to big results.</p>
        <p class="hf-hand" aria-hidden="true">You got this! <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></p>
      </div>
      </div>
      <aside class="home-aside" id="homeAside" aria-label="Today and tips">
        <section class="hw hw-today" id="hwToday"></section>
        <section class="hw hw-tip" id="hwTip"></section>
        <section class="hw hw-cats" id="hwCats"></section>
      </aside>
    </section>

    <section id="foldersView" hidden>
      <div class="controls cat-controls">
        <span class="notes-label" id="catLabel"></span>
        <button class="btn-text" id="foldersNew" type="button">+ New folder</button>
        <div class="seg" role="group" aria-label="Categories view">
          <button id="catGrid" class="seg-btn" aria-pressed="true" aria-label="Categories as grid" title="Grid view"><span class="seg-txt">Grid</span><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
          <button id="catList" class="seg-btn" aria-pressed="false" aria-label="Categories as list" title="List view"><span class="seg-txt">List</span><svg class="seg-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button>
        </div>
      </div>
      <div id="allFolders" class="notes grid"></div>
      <section class="cat-tags" id="catTags" hidden>
        <h3 class="cat-tags-title">Tags</h3>
        <div class="cat-tag-list" id="catTagList"></div>
      </section>
    </section>

    <section id="settingsView" hidden></section>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Main">
    <button type="button" class="bn-item" data-tab="home"><span class="bn-ico" data-ico="home"></span><span class="bn-label">Home</span></button>
    <button type="button" class="bn-item" data-tab="notes"><span class="bn-ico" data-ico="folder"></span><span class="bn-label">Notes</span></button>
    <button type="button" class="bn-item" data-tab="categories"><span class="bn-ico" data-ico="grid4"></span><span class="bn-label">Categories</span></button>
    <button type="button" class="bn-item" data-tab="settings"><span class="bn-ico" data-ico="gear"></span><span class="bn-label">Settings</span></button>
  </nav>

  <button class="fab" id="newNote"><span aria-hidden="true">+</span> New note</button>

  <!-- Editor sheet -->
  <div class="editor-layer" id="editorLayer" hidden>
    <div class="editor-backdrop" id="editorBackdrop"></div>
    <div class="dd-menu" id="ddMenu" role="listbox" hidden></div>
    <article class="editor" id="editor" role="dialog" aria-modal="true" aria-label="Note editor">
      <header class="ed-top">
        <button class="icon-btn" id="edBack" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button class="icon-btn" id="edUndo" data-cmd="undo" aria-label="Undo" title="Undo"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="icon-btn" id="edRedo" data-cmd="redo" aria-label="Redo" title="Redo"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <!-- flexible space: pushes the save icon and the menu to the right -->
        <span class="ed-top-spacer"></span>
        <button type="button" class="icon-btn save-btn" id="edStatus" hidden aria-label="Save" title="Save"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/></svg><span class="save-dot" aria-hidden="true"></span></button>
        <div class="ed-actions">
          <button class="icon-btn" id="edEdit" hidden aria-label="Edit note" title="Edit"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="icon-btn" id="edMenuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg></button>
          <div class="menu" id="edMenu" hidden>
            <div class="menu-theme" id="edMenuTheme" role="group" aria-label="Note theme"><span>Theme</span><div id="edMenuColors" class="swatches"></div></div>
            <button data-act="pin" id="edPinItem"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 14v6"/></svg><span id="edPinLabel">Pin</span></button>
            <button data-act="share"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10 14"/><path d="M21 3l-6.5 18-3.5-8-8-3.5z"/></svg><span>Share…</span></button>
            <button data-act="due"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span id="edDueLabel">Reminder…</span></button>
            <button data-act="dueclear" id="edDueClear" hidden><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Clear reminder</span></button>
            <button data-act="icon"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.6V5.5a2 2 0 0 1 2-2h7.1a2 2 0 0 1 1.4.6l6.4 6.4a2 2 0 0 1 0 2.8l-7.1 7.1a2 2 0 0 1-2.8 0l-6.4-6.4a2 2 0 0 1-.6-1.4z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg><span>Icon &amp; colour…</span></button>
